{% if breadcrumbs %}
<nav aria-label="Хлебные крошки" class="mb-3">
    <ol class="breadcrumb small mb-0 flex-wrap">
        {% for crumb in breadcrumbs %}
        <li class="breadcrumb-item text-break{% if forloop.last %} active{% endif %}"{% if forloop.last %} aria-current="page"{% endif %}>
            {% if crumb.url and not forloop.last %}<a href="{{ crumb.url }}">{{ crumb.title }}</a>{% else %}{{ crumb.title }}{% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
