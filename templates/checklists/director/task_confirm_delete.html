{% extends "base.html" %}
{% block title %}Удаление задачи{% endblock %}
{% block portal_content %}
<section class="card p-3 p-md-4">
    <h1 class="h3">Удалить задачу?</h1>
    <p><strong>{{ task.text }}</strong></p>
    <p class="text-secondary">
        Магазин: {{ task.store.name }} · Автор:
        {{ task.created_by.get_username|default:"не указан" }}
    </p>
    <form method="post" class="d-flex flex-wrap gap-2">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Удалить задачу</button>
        <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Отмена</a>
    </form>
</section>
{% endblock %}
