{% extends "base.html" %}

{% block title %}Вход — Чек-лист магазина{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-sm-9 col-md-7">
        <div class="card p-4">
            <h1 class="h3 mb-2">Вход</h1>
            <p class="text-secondary mb-4">Используйте учётную запись сотрудника.</p>
            {% if form.errors %}
                <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
            {% endif %}
            <form method="post" novalidate>
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Имя пользователя</label>
                    <input type="text" name="username" autofocus autocomplete="username" required id="id_username" class="form-control form-control-lg">
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control form-control-lg">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
